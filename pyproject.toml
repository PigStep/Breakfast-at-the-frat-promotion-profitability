[project]
name = "promotion-profitability"
version = "0.1.0"
description = "Weekly store-SKU grocery panel: promotion payback, price elasticity, seasonality and basket economics (77 stores, 55 UPCs, 156 weeks, 2009-2012)"
readme = "README.md"
authors = [
    { name = "VlaDDOS", email = "vladsmertev24@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# Notebook project, not a distributable package. Without this, `uv sync` tries to
# build `src/promotion_profitability/` after the rename and fails; `src/` is dead
# code either way (see README -> Status).
[tool.uv]
package = false
